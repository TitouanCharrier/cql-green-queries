name: "Sync Queries to Main"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  workflow_run:
    workflows: ["Run CodeQL Unit Tests"]
    types:
      - completed
    branches:
      - 'test'

jobs:
  sync:
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # Nécessaire pour trigger d'autres workflows

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Sync, Extract and Push
        id: sync_step
        run: |
          # 1. Identifier le point de départ
          git fetch origin main test
          git checkout main
          
          if [ -f ".last_sync" ]; then
            LAST_SHA=$(cat .last_sync)
          else
            LAST_SHA=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi

          # 2. Préparation de la structure
          git checkout test
          mkdir -p /tmp/sync_root
          CURRENT_TEST_SHA=$(git rev-parse HEAD)

          FILES=$(find codeql-custom-queries-* -name "*.ql" || true)
          for file in $FILES; do
            if [ -f "$file" ]; then
              PACK_NAME=$(echo "$file" | cut -d/ -f1)
              LANG=$(echo "$PACK_NAME" | sed 's/codeql-custom-queries-//')
              FILENAME=$(basename "$file")
              
              if [ "$LANG" = "actions" ]; then
                FINAL_PATH="codeql-custom-queries-$LANG/$FILENAME"
              else
                CATEGORY=$(echo "$file" | cut -d/ -f2)
                FINAL_PATH="codeql-custom-queries-$LANG/$CATEGORY/$FILENAME"
              fi
              
              mkdir -p "/tmp/sync_root/$(dirname "$FINAL_PATH")"
              cp "$file" "/tmp/sync_root/$FINAL_PATH"
            fi
          done

          # 3. Récupération des auteurs
          AUTHORS=$(git log ${LAST_SHA}..HEAD --format='%an|%ae' | \
                    sort -u | \
                    awk -F'|' '{printf "Co-authored-by: %s <%s>\n", $1, $2}' | \
                    grep -v "github-actions" || true)

          # 4. Application sur Main
          git checkout main
          git pull origin main

          find codeql-custom-queries-* -name "*.ql" -delete || true
          
          if [ -d "/tmp/sync_root" ] && [ "$(ls -A /tmp/sync_root)" ]; then
            cp -rv /tmp/sync_root/* .
          fi

          echo "$CURRENT_TEST_SHA" > .last_sync

          # 5. Commit et Push
          git add .
          if git diff --staged --quiet; then
            echo "sync_status=no_changes" >> $GITHUB_OUTPUT
            echo "Rien à synchroniser."
          else
            echo "chore: sync and flatten queries" > commit_msg.txt
            [ -n "$AUTHORS" ] && echo -e "\n$AUTHORS" >> commit_msg.txt
            git commit -F commit_msg.txt
            git push origin main
            echo "sync_status=pushed" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Publish Workflows if needed
        if: steps.sync_step.outputs.sync_status == 'pushed'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Récupère la liste des fichiers modifiés dans le dernier commit
          MODIFIED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          
          echo "Fichiers modifiés détectés :"
          echo "$MODIFIED_FILES"

          # Mapping des dossiers vers les fichiers YAML de workflow
          declare -A PACK_WORKFLOWS=(
            ["codeql-custom-queries-java"]="Java-PublishCodeQLPack.yml"
            ["codeql-custom-queries-python"]="Python-PublishCodeQLPack.yml"
            ["codeql-custom-queries-cpp"]="C++-PublishCodeQLPack.yml"
            ["codeql-custom-queries-csharp"]="C#-PublishCodeQLPack.yml"
            ["codeql-custom-queries-javascript"]="JS-PublishCodeQLPack.yml"
            ["codeql-custom-queries-actions"]="Actions-PublishCodeQLPack.yml"
          )

          for PACK in "${!PACK_WORKFLOWS[@]}"; do
            # Vérifie si un fichier modifié commence par le nom du pack
            # On ignore les fichiers de config du pack pour ne trigger que sur les requêtes (.ql)
            MATCH=$(echo "$MODIFIED_FILES" | grep "^$PACK/" | grep "\.ql$" || true)

            if [ -n "$MATCH" ]; then
              WORKFLOW_FILE="${PACK_WORKFLOWS[$PACK]}"
              echo ">>> Changements détectés dans $PACK. Déclenchement de $WORKFLOW_FILE..."
              
              curl -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/dispatches \
                -d '{"ref":"main"}'
            else
              echo "Pas de changements significatifs pour $PACK."
            fi
          done