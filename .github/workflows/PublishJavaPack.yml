name: Java - Test and Publish CodeQL Pack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'codeql-custom-queries-java/**'

jobs:
  test-and-publish:
    name: Test and Publish Java Pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    defaults:
      run:
        working-directory: codeql-custom-queries-java

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PACK_PUBLISH_TOKEN }}

      - name: Install CodeQL CLI
        uses: github/codeql-action/setup-codeql@v4

      - name: Install Dependencies and Run Tests
        run: |
          codeql pack install
          chmod +x launchTests.sh updateReadme.sh
          ./launchTests.sh

      - name: Increment version and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.PACK_PUBLISH_TOKEN }}
        run: |
          # Identification du fichier de configuration
          [ -f "qlpack.yml" ] && PACK_FILE="qlpack.yml" || PACK_FILE="codeql-pack.yml"
          
          OWNER="titouancharrier"
          PACKAGE_NAME="cql-green-queries-java"
          
          # Récupération de la version via l'API GitHub
          LATEST_VERSION=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$OWNER/packages/container/$PACKAGE_NAME/versions" \
            | jq -r '.[0].metadata.container.tags[0]')
          
          # Calcul de la nouvelle version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          
          # Mise à jour du fichier et publication
          sed -i "s/^version: .*/version: $NEW_VERSION/" "$PACK_FILE"
          codeql pack publish

      - name: Commit version update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --staged --quiet || (git commit -m "chore: bump java pack version to $NEW_VERSION [skip ci]" && git push origin main)
