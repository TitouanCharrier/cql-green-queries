name: Java - Run Tests and Publish CodeQL Pack
on:
  workflow_dispatch:
  push:
    paths:
      - 'codeql-custom-queries-java/**'

jobs:
  test-and-analyze:
    name: CodeQL Test and Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup CodeQL CLI
      uses: github/codeql-action/setup-codeql@v3 

    - name: Run CodeQL Tests
      run: |
        find ./codeql-custom-queries-java -maxdepth 1 -type d ! -name ".*" ! -name "codeql-custom-queries-java" -exec codeql test run {} +
  
    - name: Initialize CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: java
        queries: ./codeql-custom-queries-java

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java/dir:codeql-custom-queries-java"

  publish-pack:
    name: Publish CodeQL Pack
    runs-on: ubuntu-latest
    needs: test-and-analyze
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PACK_PUBLISH_TOKEN }}
          
      - name: Setup CodeQL CLI
        uses: github/codeql-action/setup-codeql@v3
        
      - name: Increment version and publish
        env:
          GITHUB_TOKEN: ${{ secrets.PACK_PUBLISH_TOKEN }}
        run: |
          cd codeql-custom-queries-java
          
          [ -f "qlpack.yml" ] && PACK_FILE="qlpack.yml" || PACK_FILE="codeql-pack.yml"
          
          OWNER="titouancharrier"
          PACKAGE_NAME="cql-green-queries-java"
          LATEST_VERSION=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/users/$OWNER/packages/container/$PACKAGE_NAME/versions" | jq -r '.[0].metadata.container.tags[0]')
          
          if [ "$LATEST_VERSION" == "null" ] || [ -z "$LATEST_VERSION" ]; then LATEST_VERSION="0.0.0"; fi
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Bumping version: $LATEST_VERSION -> $NEW_VERSION"
          
          sed -i "s/^version: .*/version: $NEW_VERSION/" "$PACK_FILE"
          
          codeql pack install
          codeql pack publish
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          
      - name: Commit version update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add codeql-custom-queries-java/
          git diff --staged --quiet || (git commit -m "chore: bump java pack version to ${{ env.NEW_VERSION }} [skip ci]" && git push origin main)