name: "CodeQL JavaScript Unit Tests"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Execute CodeQL Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape CRUCIALE : installe et ajoute le binaire 'codeql' au PATH
      - name: Setup CodeQL CLI
        uses: github/codeql-action/setup-codeql@v3 # Utilise la v3 pour la stabilité du binaire

      - name: Run CodeQL Tests
        id: run-tests
        run: |
          echo "Running tests for JavaScript pack..."
          codeql test run ./codeql-custom-queries-javascript --format=text