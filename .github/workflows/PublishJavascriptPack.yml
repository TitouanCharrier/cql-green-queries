name: Javascript - Run Tests and Publish CodeQL Pack
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'codeql-custom-queries-javascript/**'

jobs:
  test-and-publish:
    name: Test and Publish Javascript Pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PACK_PUBLISH_TOKEN }}

      - name: Install CodeQL CLI
        uses: github/codeql-action/setup-codeql@v4

      # ÉTAPE 1 : Exécution des tests unitaires CodeQL
      - name: Run CodeQL Tests
        run: |
          codeql test run codeql-custom-queries-javascript/ --layers --threads=0

      # ÉTAPE 2 : Incrémentation et Publication (seulement si les tests passent)
      - name: Increment version and publish
        env:
          GITHUB_TOKEN: ${{ secrets.PACK_PUBLISH_TOKEN }}
        run: |
          cd codeql-custom-queries-javascript
          
          # Identification du fichier de pack
          [ -f "qlpack.yml" ] && PACK_FILE="qlpack.yml" || PACK_FILE="codeql-pack.yml"
          if [ ! -f "$PACK_FILE" ]; then echo "Pack file not found"; exit 1; fi

          # Récupération de la version via l'API GitHub Packages
          OWNER="titouancharrier"
          PACKAGE_NAME="cql-green-queries-javascript"
          
          LATEST_VERSION=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$OWNER/packages/container/$PACKAGE_NAME/versions" \
            | jq -r '.[0].metadata.container.tags[0]')

          # Gestion du cas où le package n'existe pas encore
          if [ "$LATEST_VERSION" == "null" ] || [ -z "$LATEST_VERSION" ]; then
            NEW_VERSION="1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          
          echo "Nouvelle version : $NEW_VERSION"
          sed -i "s/^version: .*/version: $NEW_VERSION/" "$PACK_FILE"
          
          # Publication
          codeql pack install
          codeql pack publish

      # ÉTAPE 3 : Mise à jour du dépôt
      - name: Commit version update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add codeql-custom-queries-javascript/
          git diff --staged --quiet || (git commit -m "chore: bump javascript pack version [skip ci]" && git push origin main)
