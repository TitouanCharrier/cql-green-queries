name: "CodeQL Custom Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Déclenchement manuel ajouté
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initialise CodeQL avec le chemin absolu vers tes requêtes
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript
        # Utilisation de la variable workspace pour éviter les erreurs de chemin
        queries: ${{ github.workspace }}/code-custom-queries-javascript

    # Tentative de build automatique pour le JavaScript/TypeScript
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:javascript"