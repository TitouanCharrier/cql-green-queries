name: "JS - Run Tests and Publish CodeQL Pack"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'codeql-custom-queries-javascript/**'

jobs:
  analyze:
    name: Analyze & Publish JS Pack
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Nécessaire pour pouvoir push le commit de version
          token: ${{ secrets.PACK_PUBLISH_TOKEN }}

      - name: Install CodeQL CLI
        id: install-codeql
        uses: github/codeql-action/setup-codeql@v4

      - name: Run Tests
        working-directory: codeql-custom-queries-javascript
        run: |
          # Ajout automatique au PATH via les outputs de l'action
          export PATH="$(dirname ${{ steps.install-codeql.outputs.codeql-path }}):$PATH"
          
          echo "Installation des dépendances du pack..."
          codeql pack install
          
          echo "Exécution des tests unitaires CodeQL..."
          # Utilisation de la commande native plutôt qu'un .sh incertain
          codeql test run . --format=text

      - name: Increment version and publish
        env:
          GITHUB_TOKEN: ${{ secrets.PACK_PUBLISH_TOKEN }}
        run: |
          export PATH="$(dirname ${{ steps.install-codeql.outputs.codeql-path }}):$PATH"
          cd codeql-custom-queries-javascript
          
          # 1. Détection du fichier de pack
          PACK_FILE=$(ls qlpack.yml 2>/dev/null || ls codeql-pack.yml 2>/dev/null)
          if [ -z "$PACK_FILE" ]; then echo "Pack file not found"; exit 1; fi
          
          # 2. Récupération de la version actuelle sur le GitHub Container Registry
          OWNER="titouancharrier"
          PACKAGE_NAME="cql-green-queries-javascript"
          
          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$OWNER/packages/container/$PACKAGE_NAME/versions")
          
          LATEST_VERSION=$(echo "$RESPONSE" | jq -r '.[0].metadata.container.tags[0]' 2>/dev/null)

          # Si le package n'existe pas encore, on part de 1.0.0
          if [ "$LATEST_VERSION" == "null" ] || [ -z "$LATEST_VERSION" ]; then
            NEW_VERSION="1.0.0"
          else
            echo "Dernière version trouvée : $LATEST_VERSION"
            MAJOR=$(echo $LATEST_VERSION | cut -d. -f1)
            MINOR=$(echo $LATEST_VERSION | cut -d. -f2)
            PATCH=$(echo $LATEST_VERSION | cut -d. -f3)
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          
          echo "Nouvelle version déterminée : $NEW_VERSION"
          
          # 3. Mise à jour du fichier YAML
          sed -i "s/^version: .*/version: $NEW_VERSION/" "$PACK_FILE"
          
          # 4. Publication
          echo "Publication du pack sur GitHub Packages..."
          codeql pack publish

      - name: Commit version update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add codeql-custom-queries-javascript/
          git diff --staged --quiet || (git commit -m "chore: bump js pack version to match registry [skip ci]" && git push origin main)