name: "Sync and Publish CodeQL Packs"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  workflow_run:
    workflows: ["Run CodeQL Unit Tests"]
    types:
      - completed
    branches:
      - 'test'

jobs:
  # ============================================================
  # JOB 1 : Synchronisation
  # ============================================================
  sync:
    name: Sync
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Sync, Extract and Push
        run: |
          git fetch origin main test
          git checkout main
          
          git checkout test
          CURRENT_TEST_SHA=$(git rev-parse HEAD)

          mkdir -p /tmp/sync_root
          FILES=$(find codeql-custom-queries-* -name "*.ql" || true)
          for file in $FILES; do
            PACK_NAME=$(echo "$file" | cut -d/ -f1)
            LANG=$(echo "$PACK_NAME" | sed 's/codeql-custom-queries-//')
            FILENAME=$(basename "$file")
            
            if [ "$LANG" = "actions" ]; then
              FINAL_PATH="codeql-custom-queries-$LANG/$FILENAME"
            else
              CATEGORY=$(echo "$file" | cut -d/ -f2)
              FINAL_PATH="codeql-custom-queries-$LANG/$CATEGORY/$FILENAME"
            fi
            mkdir -p "/tmp/sync_root/$(dirname "$FINAL_PATH")"
            cp "$file" "/tmp/sync_root/$FINAL_PATH"
          done

          git checkout main
          git pull origin main
          find codeql-custom-queries-* -name "*.ql" -delete || true
          [ -d "/tmp/sync_root" ] && cp -rv /tmp/sync_root/* .
          echo "$CURRENT_TEST_SHA" > .last_sync

          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync and flatten queries [skip ci]"
            git push origin main
          fi

  # ============================================================
  # JOB 2 : Publication Systématique
  # ============================================================
  publish:
    name: Publish ${{ matrix.lang }}
    needs: sync
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Liste exhaustive de tes packs
        lang: [actions, cpp, csharp, java, javascript, python]
    
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # On utilise un token avec droits de push (ou le GITHUB_TOKEN si configuré)
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install CodeQL CLI
        uses: github/codeql-action/setup-codeql@v4
        id: setup-codeql

      - name: Pack and Publish
        id: publish_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$(dirname ${{ steps.setup-codeql.outputs.codeql-path }}):$PATH"
          
          # Vérification du dossier
          DIR="codeql-custom-queries-${{ matrix.lang }}"
          if [ ! -d "$DIR" ]; then echo "Dossier $DIR absent."; exit 0; fi
          cd $DIR
      
          # 1. Identification du fichier de pack
          PACK_FILE=$(ls qlpack.yml 2>/dev/null || ls codeql-pack.yml 2>/dev/null)
          if [ -z "$PACK_FILE" ]; then echo "Pas de qlpack trouvé."; exit 0; fi

          # 2. Récupération de la version sur le registre (Méthode de ton ancien commit)
          OWNER="${{ github.repository_owner }}"
          # Adaptation du nom du package selon ton format
          PACKAGE_NAME="cql-green-queries-${{ matrix.lang }}"
          
          echo "Récupération de la version pour $PACKAGE_NAME..."
          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$OWNER/packages/container/$PACKAGE_NAME/versions")
          
          LATEST_VERSION=$(echo "$RESPONSE" | jq -r '.[0].metadata.container.tags[0]' 2>/dev/null)

          if [ "$LATEST_VERSION" == "null" ] || [ -z "$LATEST_VERSION" ]; then
            echo "Aucune version publiée trouvée. Initialisation à 1.0.0"
            NEW_VERSION="1.0.0"
          else
            echo "Dernière version sur le registre : $LATEST_VERSION"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          
          echo "NEW_VER=$NEW_VERSION" >> $GITHUB_ENV
          echo "Nouvelle version déterminée : $NEW_VERSION"

          # 3. Mise à jour du fichier local et installation
          sed -i "s/^version: .*/version: $NEW_VERSION/" "$PACK_FILE"
          codeql pack install
      
          # 4. Publication
          echo "Publication du pack..."
          codeql pack publish

      - name: Commit Version Update
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # On ajoute les modifs de version
          git add codeql-custom-queries-${{ matrix.lang }}/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(${{ matrix.lang }}): bump version to ${{ env.NEW_VER }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
