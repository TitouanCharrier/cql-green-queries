name: "Sync and Publish CodeQL Packs"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  workflow_run:
    workflows: ["Run CodeQL Unit Tests"]
    types:
      - completed
    branches:
      - 'test'

jobs:
  # ============================================================
  # JOB 1 : Sync et Détection des changements
  # ============================================================
  sync:
    name: Sync and Detect
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed_packs: ${{ steps.detect.outputs.packs }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Sync, Extract and Push
        id: sync_step
        run: |
          echo "### 🔄 Phase de Synchronisation" >> $GITHUB_STEP_SUMMARY
          git fetch origin main test
          git checkout main
          
          if [ -f ".last_sync" ]; then
            LAST_SHA=$(cat .last_sync)
          else
            LAST_SHA=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi

          git checkout test
          CURRENT_TEST_SHA=$(git rev-parse HEAD)

          mkdir -p /tmp/sync_root
          # On cherche tous les fichiers .ql dans les dossiers de requêtes
          FILES=$(find codeql-custom-queries-* -name "*.ql" || true)
          for file in $FILES; do
            PACK_NAME=$(echo "$file" | cut -d/ -f1)
            LANG=$(echo "$PACK_NAME" | sed 's/codeql-custom-queries-//')
            FILENAME=$(basename "$file")
            
            if [ "$LANG" = "actions" ]; then
              FINAL_PATH="codeql-custom-queries-$LANG/$FILENAME"
            else
              CATEGORY=$(echo "$file" | cut -d/ -f2)
              FINAL_PATH="codeql-custom-queries-$LANG/$CATEGORY/$FILENAME"
            fi
            mkdir -p "/tmp/sync_root/$(dirname "$FINAL_PATH")"
            cp "$file" "/tmp/sync_root/$FINAL_PATH"
          done

          git checkout main
          git pull origin main
          # On nettoie les anciennes requêtes pour refléter exactement l'état de 'test'
          find codeql-custom-queries-* -name "*.ql" -delete || true
          [ -d "/tmp/sync_root" ] && cp -rv /tmp/sync_root/* .
          echo "$CURRENT_TEST_SHA" > .last_sync

          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync and flatten queries [skip ci]"
            git push origin main
            echo "- ✅ Synchro effectuée vers main." >> $GITHUB_STEP_SUMMARY
          else
            echo "- ℹ️ Aucun changement structurel détecté." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Detect Changed Packs for Matrix
        id: detect
        run: |
          echo "### 🔍 Détection des Packs" >> $GITHUB_STEP_SUMMARY
          # On compare avec le commit juste avant la synchro (HEAD~1)
          BEFORE=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          AFTER=$(git rev-parse HEAD)
          
          PACKS="actions cpp csharp java javascript python"
          FOUND_LIST=""

          for LANG in $PACKS; do
            DIR="codeql-custom-queries-$LANG"
            # On vérifie si des fichiers .ql ou le fichier de pack ont changé dans ce dossier
            CHANGED=$(git diff --name-only $BEFORE $AFTER | grep "^$DIR/" || true)
            
            if [ -n "$CHANGED" ]; then
              FOUND_LIST="$FOUND_LIST $LANG"
              echo "- Pack détecté pour publication : **$LANG**" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Conversion de la liste d'espace en tableau JSON pour la matrice
          JSON_ARRAY=$(echo $FOUND_LIST | tr ' ' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          [ -z "$JSON_ARRAY" ] && JSON_ARRAY="[]"
          
          echo "packs=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Matrix value : \`$JSON_ARRAY\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2 : Publication via Matrice
  # ============================================================
  publish:
    name: Publish ${{ matrix.lang }}
    needs: sync
    if: needs.sync.outputs.changed_packs != '[]' && needs.sync.outputs.changed_packs != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.sync.outputs.changed_packs) }}
    
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CodeQL CLI
        uses: github/codeql-action/setup-codeql@v4
        id: setup-codeql

      - name: Pack and Publish
        id: publish_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$(dirname ${{ steps.setup-codeql.outputs.codeql-path }}):$PATH"
          cd codeql-custom-queries-${{ matrix.lang }}
      
          # 1. Installation des dépendances
          codeql pack install
      
          # 2. Identification du fichier de pack
          PACK_FILE=$(ls qlpack.yml 2>/dev/null || ls codeql-pack.yml 2>/dev/null)
          if [ -z "$PACK_FILE" ]; then
            echo "❌ Erreur : Aucun fichier qlpack.yml ou codeql-pack.yml trouvé."
            exit 1
          fi

          # 3. Récupération de la version actuelle dans le fichier (ex: version: 1.0.5)
          CURRENT_VER=$(grep "^version:" "$PACK_FILE" | awk '{print $2}' | tr -d '"' | tr -d "'")
          
          if [ -z "$CURRENT_VER" ]; then
            echo "⚠️ Version non trouvée dans $PACK_FILE, initialisation à 1.0.0"
            NEW_VER="1.0.0"
          else
            # 4. Incrémentation de la version x.x.(x+1)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VER"
            NEW_VER="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
      
          echo "Ancienne version : $CURRENT_VER"
          echo "Nouvelle version  : $NEW_VER"
          echo "NEW_VER=$NEW_VER" >> $GITHUB_ENV
      
          # 5. Mise à jour du fichier local
          sed -i "s/^version: .*/version: $NEW_VER/" "$PACK_FILE"
      
          # 6. Publication
          codeql pack publish
          echo "✅ Pack ${{ matrix.lang }} publié en version $NEW_VER" >> $GITHUB_STEP_SUMMARY

      - name: Commit Version Update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add codeql-custom-queries-${{ matrix.lang }}/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(${{ matrix.lang }}): bump version to ${{ env.NEW_VER }} [skip ci]"
            # Rebase pour éviter les conflits si plusieurs jobs de matrice poussent en même temps
            git pull --rebase origin main
            git push origin main
          fi
