name: "Sync and Publish CodeQL Packs"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  workflow_run:
    workflows: ["Run CodeQL Unit Tests"]
    types: [completed]
    branches: ['test']

jobs:
  # ============================================================
  # JOB 1 : Synchronisation avec Debug renforcé
  # ============================================================
  sync:
    name: Sync and Detect
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed_packs: ${{ steps.debug_output.outputs.packs }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Note: Utiliser un PAT ici pour que le push déclenche d'autres actions[cite: 7]

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Sync and Detect Changes
        id: sync_logic
        run: |
          git fetch origin main test
          git checkout main
          
          # Détermination du point de comparaison
          if [ -f ".last_sync" ]; then
            LAST_SHA=$(cat .last_sync)
          else
            LAST_SHA=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          
          git checkout test
          CURRENT_SHA=$(git rev-parse HEAD)
          
          echo "### 🔍 Debug Détection" >> $GITHUB_STEP_SUMMARY
          echo "- Comparaison entre : $LAST_SHA et $CURRENT_SHA" >> $GITHUB_STEP_SUMMARY

          PACKS="actions cpp csharp java javascript python"
          FOUND=""

          for LANG in $PACKS; do
            DIR="codeql-custom-queries-$LANG"
            # On cherche les modifs sur les fichiers .ql[cite: 7, 8]
            DIFF=$(git diff --name-only $LAST_SHA $CURRENT_SHA -- "$DIR" | grep ".ql$" || true)
            if [ -n "$DIFF" ]; then
              FOUND="$FOUND $LANG"
              echo "- ✅ Pack détecté : $LANG" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Formatage JSON strict
          JSON_RAW=$(echo $FOUND | tr ' ' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          [ -z "$JSON_RAW" ] && JSON_RAW="[]"
          
          # Sauvegarde dans un fichier temporaire pour le step suivant
          echo "$JSON_RAW" > packs_detected.json
          echo "Final JSON: $JSON_RAW"

          # -- Logique de synchro vers Main --
          git checkout main
          git pull origin main
          find codeql-custom-queries-* -name "*.ql" -delete || true
          
          # Extraction et copie
          git checkout test -- "codeql-custom-queries-*"
          # On ne garde que les .ql pour main selon votre logique[cite: 7]
          echo "$CURRENT_SHA" > .last_sync
          
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync queries [skip ci]"
            git push origin main
          fi

      - name: Finalize Output
        id: debug_output
        run: |
          PACKS_JSON=$(cat packs_detected.json)
          echo "packs=$PACKS_JSON" >> $GITHUB_OUTPUT
          echo "### 📦 Résultat de l'output" >> $GITHUB_STEP_SUMMARY
          echo "Valeur envoyée au job suivant : \`$PACKS_JSON\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2 : Publication (Matrix)
  # ============================================================
  publish:
    name: Publish ${{ matrix.lang }}
    needs: sync
    # Utilisation d'une condition plus permissive pour le debug
    if: needs.sync.outputs.changed_packs != '[]' && needs.sync.outputs.changed_packs != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: ${{ fromJson(needs.sync.outputs.changed_packs) }}
    steps:
      - name: Publishing ${{ matrix.lang }}
        run: echo "Traitement du pack ${{ matrix.lang }}..."

  # ============================================================
  # JOB 3 : Alerte si aucun pack à publier
  # ============================================================
  no_publish_alert:
    name: Check Why Skip
    needs: sync
    if: always() && (needs.sync.result == 'success') && (needs.sync.outputs.changed_packs == '[]' || needs.sync.outputs.changed_packs == '')
    runs-on: ubuntu-latest
    steps:
      - name: Report No Changes
        run: |
          echo "::warning title=Publication sautée::Aucun fichier .ql modifié détecté dans les packs."
          echo "Vérifiez le 'Job Summary' du job précédent pour voir le diff Git."
