name: "Sync and Publish CodeQL Packs"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  workflow_run:
    workflows: ["Run CodeQL Unit Tests"]
    types:
      - completed
    branches:
      - 'test'

jobs:
  # ============================================================
  # JOB 1 : Sync des queries de test vers main
  # ============================================================
  sync:
    name: Sync Queries to Main
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      changed_packs: ${{ steps.sync_step.outputs.changed_packs }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Sync, Extract and Push
        id: sync_step
        run: |
          # 1. Identifier le point de départ
          git fetch origin main test
          git checkout main

          if [ -f ".last_sync" ]; then
            LAST_SHA=$(cat .last_sync)
          else
            LAST_SHA=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi

          # 2. Préparation de la structure
          git checkout test
          mkdir -p /tmp/sync_root
          CURRENT_TEST_SHA=$(git rev-parse HEAD)

          FILES=$(find codeql-custom-queries-* -name "*.ql" || true)
          for file in $FILES; do
            if [ -f "$file" ]; then
              PACK_NAME=$(echo "$file" | cut -d/ -f1)
              LANG=$(echo "$PACK_NAME" | sed 's/codeql-custom-queries-//')
              FILENAME=$(basename "$file")

              if [ "$LANG" = "actions" ]; then
                FINAL_PATH="codeql-custom-queries-$LANG/$FILENAME"
              else
                CATEGORY=$(echo "$file" | cut -d/ -f2)
                FINAL_PATH="codeql-custom-queries-$LANG/$CATEGORY/$FILENAME"
              fi

              mkdir -p "/tmp/sync_root/$(dirname "$FINAL_PATH")"
              cp "$file" "/tmp/sync_root/$FINAL_PATH"
            fi
          done

          # 3. Récupération des auteurs
          AUTHORS=$(git log ${LAST_SHA}..HEAD --format='%an|%ae' | \
                    sort -u | \
                    awk -F'|' '{printf "Co-authored-by: %s <%s>\n", $1, $2}' | \
                    grep -v "github-actions" || true)

          # 4. Application sur Main
          git checkout main
          git pull origin main

          # Détection des packs modifiés AVANT le nettoyage
          BEFORE=$LAST_SHA
          AFTER=$CURRENT_TEST_SHA
          CHANGED_PACKS="[]"
          PACKS="actions cpp csharp java javascript python"
          PACK_LIST=""

          for LANG in $PACKS; do
            PACK="codeql-custom-queries-$LANG"
            CHANGED=$(git diff --name-only $BEFORE $AFTER 2>/dev/null \
              | grep "^$PACK/" \
              | grep -v 'qlpack.yml' \
              | grep -v 'codeql-pack.yml' || true)
            if [ -n "$CHANGED" ]; then
              PACK_LIST="$PACK_LIST $LANG"
            fi
          done

          # Formatage en JSON array pour la matrix
          CHANGED_PACKS=$(echo $PACK_LIST | tr ' ' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ -z "$CHANGED_PACKS" ] || [ "$CHANGED_PACKS" = "null" ]; then
            CHANGED_PACKS="[]"
          fi
          echo "changed_packs=$CHANGED_PACKS" >> $GITHUB_OUTPUT
          echo "Packs modifiés : $CHANGED_PACKS"

          # Nettoyage sélectif des fichiers .ql
          find codeql-custom-queries-* -name "*.ql" -delete || true

          if [ -d "/tmp/sync_root" ] && [ "$(ls -A /tmp/sync_root)" ]; then
            cp -rv /tmp/sync_root/* .
          fi

          echo "$CURRENT_TEST_SHA" > .last_sync

          # 5. Commit et Push
          git add .
          if git diff --staged --quiet; then
            echo "Rien à synchroniser."
          else
            echo "chore: sync and flatten queries" > commit_msg.txt
            [ -n "$AUTHORS" ] && echo -e "\n$AUTHORS" >> commit_msg.txt
            git commit -F commit_msg.txt
            git push origin main
          fi

  # ============================================================
  # JOB 2 : Publish en matrix, uniquement sur les packs modifiés
  # ============================================================
  publish:
    name: Publish ${{ matrix.lang }} Pack
    needs: sync
    if: needs.sync.outputs.changed_packs != '[]' && needs.sync.outputs.changed_packs != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.sync.outputs.changed_packs) }}

    permissions:
      packages: write
      contents: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CodeQL CLI
        id: install-codeql
        uses: github/codeql-action/setup-codeql@v4

      - name: Setup CodeQL Path
        run: echo "$(dirname ${{ steps.install-codeql.outputs.codeql-path }})" >> $GITHUB_PATH

      - name: Validate and Publish
        id: publish_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd codeql-custom-queries-${{ matrix.lang }}

          echo "Installation des dépendances..."
          codeql pack install

          PACK_FILE=$(ls qlpack.yml 2>/dev/null || ls codeql-pack.yml 2>/dev/null)
          if [ -z "$PACK_FILE" ]; then echo "Pack file not found"; exit 1; fi

          OWNER="green-code-initiative"
          PACKAGE_NAME="${{ matrix.lang }}-queries"

          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$OWNER/packages/container/$PACKAGE_NAME/versions")

          LATEST_VERSION=$(echo "$RESPONSE" | jq -r '.[0].metadata.container.tags[0]' 2>/dev/null)

          if [ "$LATEST_VERSION" == "null" ] || [ -z "$LATEST_VERSION" ]; then
            NEW_VERSION="1.0.0"
          else
            echo "Dernière version ${{ matrix.lang }} trouvée : $LATEST_VERSION"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "Nouvelle version ${{ matrix.lang }} : $NEW_VERSION"
          sed -i "s/^version: .*/version: $NEW_VERSION/" "$PACK_FILE"

          echo "Publication du pack ${{ matrix.lang }}..."
          codeql pack publish
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version update
        id: commit_step
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add codeql-custom-queries-${{ matrix.lang }}/

          if ! git diff --staged --quiet; then
            git commit -m "chore(${{ matrix.lang }}): bump version to ${{ steps.publish_step.outputs.new_version }} [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "new_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Mark status via API
        if: steps.commit_step.outputs.new_sha != ''
        run: |
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.commit_step.outputs.new_sha }} \
            -d "{
              \"state\":\"success\",
              \"context\":\"Publish ${{ matrix.lang }}\",
              \"description\":\"Pack ${{ matrix.lang }} publié avec succès\",
              \"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"