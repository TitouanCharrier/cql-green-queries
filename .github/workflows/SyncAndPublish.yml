name: "Sync and Publish CodeQL Packs"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  workflow_run:
    workflows: ["Run CodeQL Unit Tests"]
    types:
      - completed
    branches:
      - 'test'

jobs:
  # ============================================================
  # JOB 1 : Sync et Détection des changements
  # ============================================================
  sync:
    name: Sync and Detect
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed_packs: ${{ steps.detect.outputs.packs }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Sync, Extract and Push
        id: sync_step
        run: |
          echo "### 🔄 Phase de Synchronisation" >> $GITHUB_STEP_SUMMARY
          git fetch origin main test
          git checkout main
          
          if [ -f ".last_sync" ]; then
            LAST_SHA=$(cat .last_sync)
          else
            LAST_SHA=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi

          git checkout test
          CURRENT_TEST_SHA=$(git rev-parse HEAD)

          mkdir -p /tmp/sync_root
          FILES=$(find codeql-custom-queries-* -name "*.ql" || true)
          for file in $FILES; do
            PACK_NAME=$(echo "$file" | cut -d/ -f1)
            LANG=$(echo "$PACK_NAME" | sed 's/codeql-custom-queries-//')
            FILENAME=$(basename "$file")
            if [ "$LANG" = "actions" ]; then
              FINAL_PATH="codeql-custom-queries-$LANG/$FILENAME"
            else
              CATEGORY=$(echo "$file" | cut -d/ -f2)
              FINAL_PATH="codeql-custom-queries-$LANG/$CATEGORY/$FILENAME"
            fi
            mkdir -p "/tmp/sync_root/$(dirname "$FINAL_PATH")"
            cp "$file" "/tmp/sync_root/$FINAL_PATH"
          done

          git checkout main
          git pull origin main
          find codeql-custom-queries-* -name "*.ql" -delete || true
          [ -d "/tmp/sync_root" ] && cp -rv /tmp/sync_root/* .
          echo "$CURRENT_TEST_SHA" > .last_sync

          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync and flatten queries [skip ci]"
            git push origin main
            echo "- ✅ Synchro effectuée vers main." >> $GITHUB_STEP_SUMMARY
          else
            echo "- ℹ️ Aucun changement structurel détecté." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Detect Changed Packs for Matrix
        id: detect
        run: |
          echo "### 🔍 Détection des Packs" >> $GITHUB_STEP_SUMMARY
          BEFORE=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          AFTER=$(git rev-parse HEAD)
          
          PACKS="actions cpp csharp java javascript python"
          FOUND_LIST=""

          for LANG in $PACKS; do
            DIR="codeql-custom-queries-$LANG"
            CHANGED=$(git diff --name-only $BEFORE $AFTER | grep "^$DIR/" | grep ".ql$" || true)
            
            if [ -n "$CHANGED" ]; then
              FOUND_LIST="$FOUND_LIST $LANG"
              echo "- Pack détecté : **$LANG**" >> $GITHUB_STEP_SUMMARY
            fi
          done

          JSON_ARRAY=$(echo $FOUND_LIST | tr ' ' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          [ -z "$JSON_ARRAY" ] && JSON_ARRAY="[]"
          
          echo "packs=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Matrix value : \`$JSON_ARRAY\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2 : Publication via Matrice
  # ============================================================
  publish:
    name: Publish ${{ matrix.lang }}
    needs: sync
    if: needs.sync.outputs.changed_packs != '[]' && needs.sync.outputs.changed_packs != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.sync.outputs.changed_packs) }}
    
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CodeQL CLI
        uses: github/codeql-action/setup-codeql@v4
        id: setup-codeql

      - name: Pack and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$(dirname ${{ steps.setup-codeql.outputs.codeql-path }}):$PATH"
          cd codeql-custom-queries-${{ matrix.lang }}
      
          echo "### 🛠 Debug : Vérification du contenu" >> $GITHUB_STEP_SUMMARY
          ls -R >> $GITHUB_STEP_SUMMARY
      
          # 1. Installation des dépendances (Mode non-strict obligatoire ici)
          echo "Installation des dépendances..."
          codeql pack install
      
          # 2. Logique de versioning (Récupération GHCR)
          OWNER="green-code-initiative"
          PACKAGE_NAME="${{ matrix.lang }}-queries"
      
          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$OWNER/packages/container/$PACKAGE_NAME/versions")
      
          LATEST=$(echo "$RESPONSE" | jq -r '.[0].metadata.container.tags[0]' 2>/dev/null)
      
          if [ "$LATEST" == "null" ] || [ -z "$LATEST" ]; then
            NEW_VER="1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEW_VER="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
      
          echo "- Version calculée : $NEW_VER" >> $GITHUB_STEP_SUMMARY
      
          # 3. Mise à jour du fichier de configuration
          PACK_FILE=$(ls qlpack.yml 2>/dev/null || ls codeql-pack.yml 2>/dev/null)
          sed -i "s/^version: .*/version: $NEW_VER/" "$PACK_FILE"
      
          # 4. Publication finale
          echo "Publication du pack..."
          codeql pack publish
      
          echo "✅ Pack ${{ matrix.lang }} publié avec succès en version $NEW_VER" >> $GITHUB_STEP_SUMMARY

      - name: Commit Version Update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add codeql-custom-queries-${{ matrix.lang }}/
          if ! git diff --staged --quiet; then
            git commit -m "chore(${{ matrix.lang }}): bump version [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
