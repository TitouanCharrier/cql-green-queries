name: "Python - Publish CodeQL Pack"

on:
  workflow_dispatch:
  # Tu peux garder le workflow_run si la synchro doit déclencher la vérification
  workflow_run:
    workflows: ["Nom_du_Workflow_Synchro"]
    types:
      - completed

jobs:
  check_changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Nécessaire pour comparer avec le commit précédent

      - name: Detect changes in Python folder
        id: diff
        run: |
          # On compare le commit actuel (HEAD) au parent (HEAD^)
          if git diff --quiet HEAD^ HEAD -- codeql-custom-queries-python/; then
            echo "No changes detected."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in codeql-custom-queries-python/."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish Python Pack
    needs: check_changes
    # Le job ne s'exécute que si changements détectés OU lancement manuel
    if: |
      always() && 
      (needs.check_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    
    permissions:
      packages: write
      contents: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CodeQL CLI
        id: install-codeql
        uses: github/codeql-action/setup-codeql@v4

      - name: Setup CodeQL Path
        run: echo "$(dirname ${{ steps.install-codeql.outputs.codeql-path }})" >> $GITHUB_PATH

      - name: Validate and Publish
        id: publish_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd codeql-custom-queries-python
          
          echo "Installation des dépendances..."
          codeql pack install
          
          PACK_FILE=$(ls qlpack.yml 2>/dev/null || ls codeql-pack.yml 2>/dev/null)
          if [ -z "$PACK_FILE" ]; then echo "Pack file not found"; exit 1; fi
          
          OWNER="green-code-initiative"
          PACKAGE_NAME="python-queries"
          
          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$OWNER/packages/container/$PACKAGE_NAME/versions")
          
          LATEST_VERSION=$(echo "$RESPONSE" | jq -r '.[0].metadata.container.tags[0]' 2>/dev/null)

          if [ "$LATEST_VERSION" == "null" ] || [ -z "$LATEST_VERSION" ]; then
            NEW_VERSION="1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          
          echo "Nouvelle version Python : $NEW_VERSION"
          sed -i "s/^version: .*/version: $NEW_VERSION/" "$PACK_FILE"
          
          codeql pack publish
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version update
        id: commit_step
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add codeql-custom-queries-python/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(python): bump version to ${{ steps.publish_step.outputs.new_version }} [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "new_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Mark status via API
        if: steps.commit_step.outputs.new_sha != ''
        run: |
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.commit_step.outputs.new_sha }} \
            -d '{
              "state":"success",
              "context":"Publish Python",
              "description":"Pack Python publié avec succès",
              "target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
